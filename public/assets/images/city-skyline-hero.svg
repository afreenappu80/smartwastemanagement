    <circle cx="560" cy="240" r="230"/>
    <circle cx="560" cy="240" r="330"/>
  </g>

  <!-- Distant wind turbines -->
  <g stroke="#A7F3D0" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="540" x2="120" y2="670"/>
    <path d="M120 540 L102 518 M120 540 L146 535 M120 540 L114 568"/>
    <line x1="595" y1="490" x2="595" y2="650"/>
    <path d="M595 490 L573 465 M595 490 L625 486 M595 490 L589 522"/>
  </g>

  <!-- Distant Skyline Silhouette -->
  <g fill="url(#bldg-back)" opacity="0.68">
