<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" fill="none" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky-bg" x1="0" y1="0" x2="720" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#043A2C"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="560" cy="240" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg-back" x1="0" y1="420" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#075E47"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="bldg-mid" x1="0" y1="470" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#044736"/>
      <stop offset="100%" stop-color="#012018"/>
    </linearGradient>
    <linearGradient id="hill-front" x1="0" y1="740" x2="720" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <rect width="720" height="900" fill="url(#sky-bg)"/>
  <rect width="720" height="900" fill="url(#sun-glow)"/>

  <!-- Subtle topographic contour arcs in upper sky -->
  <g stroke="#A7F3D0" stroke-opacity="0.07" stroke-width="1.2">
