<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <!-- Daylight urban sidewalk curb with plastic bottles & packaging -->
  <rect width="640" height="480" fill="#CBD5E1"/>
  <!-- Asphalt road -->
  <path d="M0 295 L640 245 L640 480 L0 480 Z" fill="#475569"/>
  <path d="M0 295 L640 245 L640 268 L0 318 Z" fill="#94A3B8"/>
  <!-- Sidewalk slabs -->
  <path d="M0 165 L640 130 L640 245 L0 295 Z" fill="#E2E8F0"/>
  <line x1="190" y1="154" x2="170" y2="282" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="420" y1="141" x2="415" y2="262" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Park wall and shrubs -->
  <rect x="0" y="0" width="640" height="168" fill="#D1FAE5"/>
  <path d="M0 110 Q110 68 230 112 T470 98 T640 115 L640 168 L0 168 Z" fill="#059669" fill-opacity="0.35"/>
  <path d="M0 130 L640 100 L640 155 L0 185 Z" fill="#64748B" fill-opacity="0.22"/>

  <!-- Ground shadow under plastic pile -->
  <ellipse cx="325" cy="336" rx="185" ry="42" fill="#1E293B" fill-opacity="0.34"/>

  <!-- Plastic bag mound -->
  <path d="M180 322 C175 268 228 242 276 258 C312 240 368 258 378 308 C382 332 342 350 282 352 C220 354 184 342 180 322 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <path d="M225 278 C252 296 286 298 320 278" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blue & clear PET plastic bottles -->
  <g transform="translate(260 295) rotate(-18)">
    <rect x="0" y="14" width="76" height="32" rx="10" fill="#38BDF8" fill-opacity="0.82" stroke="#0284C7" stroke-width="2"/>
    <rect x="76" y="21" width="14" height="18" rx="3" fill="#0369A1"/>
    <rect x="22" y="14" width="26" height="32" fill="#E0F2FE" fill-opacity="0.7"/>
  </g>
  <g transform="translate(362 280) rotate(22)">
    <rect x="0" y="12" width="84" height="34" rx="11" fill="#60A5FA" fill-opacity="0.78" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="20" width="14" height="18" rx="3" fill="#1D4ED8"/>
    <rect x="28" y="12" width="24" height="34" fill="#DBEAFE" fill-opacity="0.8"/>
  </g>
  <g transform="translate(175 302) rotate(12)">
    <rect x="0" y="10" width="68" height="28" rx="9" fill="#93C5FD" fill-opacity="0.75" stroke="#3B82F6" stroke-width="2"/>
    <rect x="68" y="17" width="12" height="14" rx="3" fill="#EF4444"/>
  </g>
  <!-- Crushed milk jug -->
  <path d="M398 258 L466 250 L488 318 L412 332 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <rect x="424" y="236" width="24" height="16" rx="4" fill="#0284C7"/>
  <!-- Red plastic wrapper -->
  <path d="M295 335 L368 320 L382 348 L308 358 Z" fill="#F87171" fill-opacity="0.85" stroke="#DC2626" stroke-width="1.5"/>
</svg>
