      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="ws-mint" x1="20" y1="14" x2="54" y2="56" gradientUnits="userSpaceOnUse">
