  <path d="M46.5 27.5C38.5 27.5 31.5 31.8 30.2 40.5C29.8 43.3 30.8 45.6 32.8 46.8C38.2 48.2 45.4 44.8 46.6 36.2C47.0 33.1 46.9 30.1 46.5 27.5Z" fill="url(#ws-mint)"/>
  <path d="M31.5 47.2C34.8 41.2 39.2 36.4 44.6 32.2" stroke="#064E3B" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Brand Wordmark -->
  <text x="86" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#064E3B">Waste<tspan fill="#059669">Smart</tspan></text>
  <text x="87" y="59" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.08em" fill="#4B5563">URBAN WASTE INTELLIGENCE</text>
</svg>
